server.port=8080
spring.application.name=prestamos-backend

# Base de datos SQLite embebida en la carpeta de usuario
spring.datasource.url=jdbc:sqlite:${user.home}/.prestamos_app/datos_prestamos.db
spring.datasource.driver-class-name=org.sqlite.JDBC

spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Exponer Actuator para que Electron verifique la disponibilidad en /actuator/health
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# CORS habilitado para llamadas locales desde Electron y Vite
cors.allowed-origins=http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,file://

management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET,POST,OPTIONS
